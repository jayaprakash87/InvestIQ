name: Publish verified v0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".release/v0.1.0.json"

permissions:
  contents: write

concurrency:
  group: investiq-release-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and build tooling
        run: python -m pip install -e ".[dev]"
      - name: Check release manifest and package version
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          manifest = json.loads(Path(".release/v0.1.0.json").read_text())
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert manifest["version"] == project["version"] == "0.1.0"
          assert manifest["tag"] == "v0.1.0"
          assert manifest["package"] == project["name"] == "investiq-core"
          assert Path(manifest["release_notes"]).is_file()
          print("Release manifest and package version verified.")
          PY
      - name: Run release acceptance checks
        run: |
          ruff check .
          pytest -q
          investiq demo --output /tmp/investiq-release-example.json
          investiq validate /tmp/investiq-release-example.json --basis recorded
          python -m build --sdist --wheel
      - name: Publish v0.1.0 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.1.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; no changes made." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "InvestIQ v0.1.0 public research toolkit"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" dist/* \
            --verify-tag \
            --title "InvestIQ v0.1.0" \
            --notes-file docs/releases/v0.1.0.md
          echo "Published $tag with source and wheel distributions." >> "$GITHUB_STEP_SUMMARY"
