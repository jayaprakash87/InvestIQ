name: CI

on:
  pull_request:
    # Draft PR events still create a skipped workflow, but run no paid runner.
    # Full CI executes for the latest head once the PR is ready, and again
    # on any subsequent update so branch protection cannot accept stale CI.
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Do not provision a runner for WIP draft pull requests.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and build tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and workflow acceptance tests
        run: pytest -q
      - name: Local UI JavaScript syntax
        run: |
          node --check src/investiq_core/web/app.js
          node --check src/investiq_core/web/connect.js
      - name: Wheel and source distribution
        run: python -m build --sdist --wheel
      - name: Installed CLI smoke test
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          investiq demo --output /tmp/investiq-demo.json
          investiq validate /tmp/investiq-demo.json --basis recorded
          investiq research --help
          investiq replay --help
          investiq app --help
          python -c 'from importlib.resources import files; root=files("investiq_core").joinpath("web"); assert all(root.joinpath(p).read_bytes() for p in ("index.html","styles.css","app.js","connect.js"))'
          python -c 'from importlib.metadata import version; assert version("investiq-core") == "0.2.0"'
