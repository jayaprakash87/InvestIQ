name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and build tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and workflow acceptance tests
        run: pytest -q
      - name: Wheel and source distribution
        run: python -m build --sdist --wheel
      - name: Installed CLI smoke test
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          investiq demo --output /tmp/investiq-demo.json
          investiq validate /tmp/investiq-demo.json --basis recorded
